<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="mali-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#mali-bg)"/>
  <!-- Hospital Gown -->
  <path d="M40,155 Q100,135 160,155 L175,200 L25,200 Z" fill="#7c3aed"/>
  <!-- Head & Neck -->
  <rect x="88" y="98" width="24" height="22" rx="4" fill="#deb887"/>
  <ellipse cx="100" cy="76" rx="28" ry="32" fill="#f5d0a9"/>
  <!-- Hair (Shoulder-length black) -->
  <path d="M72,76 Q70,50 100,48 Q130,50 128,76 Q135,110 128,125 Q120,95 100,60 Q80,95 72,125 Z" fill="#1e1b4b"/>
  <!-- Eyes & Eyebrows (focused on breathing) -->
  <ellipse cx="88" cy="74" rx="2.5" ry="2" fill="#1e293b"/>
  <ellipse cx="112" cy="74" rx="2.5" ry="2" fill="#1e293b"/>
  <path d="M84,68 Q88,66 92,69" stroke="#334155" stroke-width="1.5" fill="none"/>
  <path d="M108,69 Q112,66 116,68" stroke="#334155" stroke-width="1.5" fill="none"/>
  <!-- Nebulizer in mouth with gentle aerosol mist -->
  <g>
    <!-- Nebulizer cup -->
    <rect x="94" y="108" width="12" height="18" rx="2" fill="#c4b5fd" stroke="#8b5cf6" stroke-width="1.5"/>
    <!-- Mouthpiece -->
    <rect x="92" y="88" width="16" height="8" rx="2" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
    <path d="M100,96 L100,108" stroke="#8b5cf6" stroke-width="3"/>
    <!-- Oxygen tubing to machine -->
    <path d="M100,126 Q100,150 130,165 L150,175" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <!-- Aerosol mist clouds -->
    <ellipse cx="82" cy="85" rx="6" ry="4" fill="#e0e7ff" opacity="0.6"/>
    <ellipse cx="74" cy="78" rx="8" ry="5" fill="#e0e7ff" opacity="0.45"/>
    <ellipse cx="80" cy="70" rx="5" ry="3" fill="#e0e7ff" opacity="0.3"/>
  </g>
  <!-- Tag -->
  <rect x="25" y="15" width="150" height="24" rx="12" fill="#6d28d9" opacity="0.95"/>
  <text x="100" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">นางมะลิ (55 ปี) • หอบหืดเฉียบพลัน</text>
</svg>