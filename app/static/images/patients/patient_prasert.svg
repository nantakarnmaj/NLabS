<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="prasert-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#prasert-bg)"/>
  <!-- Tripod Posture (Leaning forward, hands braced) -->
  <path d="M35,160 Q100,130 165,160 L180,200 L20,200 Z" fill="#b91c1c"/>
  <!-- Head & Neck (Leaning forward) -->
  <rect x="86" y="95" width="28" height="24" rx="4" fill="#deb887"/>
  <ellipse cx="100" cy="74" rx="29" ry="33" fill="#f5d0a9"/>
  <!-- Hair (Thin white/grey) -->
  <path d="M71,72 Q71,48 100,46 Q129,48 129,72 Q122,58 100,56 Q78,58 71,72 Z" fill="#cbd5e1"/>
  <!-- Facial expression: Tachypneic distress, accessory muscle use -->
  <ellipse cx="88" cy="72" rx="2.5" ry="2" fill="#1e293b"/>
  <ellipse cx="112" cy="72" rx="2.5" ry="2" fill="#1e293b"/>
  <!-- Flaring nostrils -->
  <ellipse cx="96" cy="85" rx="2" ry="1.5" fill="#78350f"/>
  <ellipse cx="104" cy="85" rx="2" ry="1.5" fill="#78350f"/>
  <!-- Open mouth gasping -->
  <ellipse cx="100" cy="94" rx="6" ry="4" fill="#7f1d1d"/>
  <!-- Emergency Vital Sign Banner -->
  <rect x="25" y="15" width="150" height="24" rx="12" fill="#991b1b" opacity="0.95"/>
  <text x="100" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">นายประเสริฐ (70 ปี) • หายใจวิกฤต</text>
  <!-- Warning badge -->
  <circle cx="165" cy="50" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <text x="165" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">!</text>
</svg>