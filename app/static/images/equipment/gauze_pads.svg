<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="gauzeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#64748B" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="#F8FAFC"/>
  <!-- Envelope / Pouch -->
  <polygon points="30,50 170,50 170,170 30,170" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="30,50 100,105 170,50" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <!-- Gauze Pad Stack -->
  <g filter="url(#gauzeShadow)">
    <rect x="55" y="80" width="90" height="80" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <!-- Mesh pattern -->
    <line x1="65" y1="80" x2="65" y2="160" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="75" y1="80" x2="75" y2="160" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="85" y1="80" x2="85" y2="160" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="95" y1="80" x2="95" y2="160" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="105" y1="80" x2="105" y2="160" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="115" y1="80" x2="115" y2="160" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="125" y1="80" x2="125" y2="160" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="135" y1="80" x2="135" y2="160" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <!-- Horizontal mesh -->
    <line x1="55" y1="90" x2="145" y2="90" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="55" y1="100" x2="145" y2="100" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="55" y1="110" x2="145" y2="110" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="55" y1="120" x2="145" y2="120" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="55" y1="130" x2="145" y2="130" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="55" y1="140" x2="145" y2="140" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="55" y1="150" x2="145" y2="150" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>
  <!-- Label tag -->
  <rect x="68" y="112" width="64" height="18" rx="3" fill="#10B981"/>
  <text x="100" y="124" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">STERILE GAUZE 4x4</text>
</svg>
