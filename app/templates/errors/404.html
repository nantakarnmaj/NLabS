{% extends "base.html" %}

{% block title %}Room Not Found — BreathQuest{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16 sm:py-24 text-center space-y-6">
  <div class="w-16 h-16 mx-auto rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-cyan-400">
    <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
  </div>
  <h1 class="text-2xl font-bold text-white tracking-tight">Room Not Found (404)</h1>
  <p class="text-sm text-slate-300 leading-relaxed">{{ message or "The room or section you are trying to visit does not exist in Ward 5." }}</p>
  <div class="pt-4">
    <a href="{{ back_url or url_for('main.ward') }}" class="inline-flex items-center justify-center px-6 py-3 rounded-xl text-sm font-semibold text-slate-900 bg-cyan-400 hover:bg-cyan-300 transition touch-target">
      Return to Ward
    </a>
  </div>
</div>
{% endblock %}
