{% extends "base.html" %}

{% block title %}System Error — BreathQuest{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16 sm:py-24 text-center space-y-6">
  <div class="w-16 h-16 mx-auto rounded-2xl bg-red-950/60 border border-red-800 flex items-center justify-center text-red-400">
    <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
  </div>
  <h1 class="text-2xl font-bold text-white tracking-tight">System Error (500)</h1>
  <p class="text-sm text-slate-300 leading-relaxed">{{ message or "An unexpected error occurred. Please try again or return to the main ward." }}</p>
  <div class="pt-4">
    <a href="{{ back_url or url_for('main.ward') }}" class="inline-flex items-center justify-center px-6 py-3 rounded-xl text-sm font-semibold text-slate-900 bg-cyan-400 hover:bg-cyan-300 transition touch-target">
      Return to Ward
    </a>
  </div>
</div>
{% endblock %}
