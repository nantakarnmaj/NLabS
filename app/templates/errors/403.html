{% extends "base.html" %}

{% block title %}{{ title or "Access Restricted" }} — BreathQuest{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16 sm:py-24 text-center space-y-6">
  <div class="w-16 h-16 mx-auto rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-400">
    <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
    </svg>
  </div>
  <h1 class="text-2xl font-bold text-white tracking-tight">{{ title or "Access Restricted" }}</h1>
  <p class="text-sm text-slate-300 leading-relaxed">{{ message or "You do not have access to this room yet." }}</p>
  <div class="pt-4">
    <a href="{{ back_url or url_for('main.ward') }}" class="inline-flex items-center justify-center px-6 py-3 rounded-xl text-sm font-semibold text-slate-900 bg-cyan-400 hover:bg-cyan-300 transition touch-target">
      กลับสู่แผนผังหอผู้ป่วย (Return to Ward)
    </a>
  </div>
</div>
{% endblock %}
